<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="1100" height="680">
  <rect width="1100" height="680" fill="#ffffff"/>
  <text x="24" y="36" fill="#1f2933" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">Garage door wall controller - wiring diagram</text>
  <text x="24" y="58" fill="#52606d" font-family="Segoe UI, sans-serif" font-size="14">Each line is one wire. COM and NO are the only wires that touch the opener.</text>

  <rect x="24" y="78" width="230" height="46" rx="6" fill="#f5f7fa" stroke="#1f2933"/>
  <text x="40" y="106" fill="#1f2933" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">5 V, 2 A USB supply</text>
  <line x1="139" y1="124" x2="139" y2="148" stroke="#1f2933" stroke-width="2"/>
  <text x="148" y="140" fill="#52606d" font-family="Segoe UI, sans-serif" font-size="12">USB</text>

  <rect x="24" y="148" width="230" height="470" rx="6" fill="#f5f7fa" stroke="#1f2933" stroke-width="1.5"/>
  <text x="40" y="176" fill="#1f2933" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">ESP32-DevKitC-32E</text>
  <g font-family="Segoe UI, sans-serif" font-size="14" fill="#1f2933">
    <text x="40" y="214">5V</text>
    <text x="40" y="254">GND</text>
    <text x="40" y="294">GPIO27</text>
    <text x="40" y="364">3V3</text>
    <text x="40" y="404">GPIO21</text>
    <text x="40" y="444">GPIO22</text>
    <text x="40" y="514">GPIO25</text>
    <text x="40" y="564">GPIO26</text>
  </g>
  <g fill="#1f2933">
    <circle cx="254" cy="210" r="4"/>
    <circle cx="254" cy="250" r="4"/>
    <circle cx="254" cy="290" r="4"/>
    <circle cx="254" cy="360" r="4"/>
    <circle cx="254" cy="400" r="4"/>
    <circle cx="254" cy="440" r="4"/>
    <circle cx="254" cy="510" r="4"/>
    <circle cx="254" cy="560" r="4"/>
  </g>

  <rect x="430" y="168" width="250" height="160" rx="6" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
  <text x="446" y="194" fill="#1f2933" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Coil drive</text>
  <text x="446" y="220" fill="#52606d" font-family="Segoe UI, sans-serif" font-size="14">R1 1 k� to 2N2222 base</text>
  <text x="446" y="242" fill="#52606d" font-family="Segoe UI, sans-serif" font-size="14">Emitter to GND</text>
  <text x="446" y="264" fill="#52606d" font-family="Segoe UI, sans-serif" font-size="14">Collector to K1 coil</text>
  <text x="446" y="286" fill="#52606d" font-family="Segoe UI, sans-serif" font-size="14">1N4007 across the coil</text>
  <text x="446" y="308" fill="#52606d" font-family="Segoe UI, sans-serif" font-size="14">COM and NO leave this box</text>

  <line x1="254" y1="210" x2="430" y2="210" stroke="#1f2933" stroke-width="2"/>
  <text x="300" y="202" fill="#52606d" font-family="Segoe UI, sans-serif" font-size="12">5V</text>
  <line x1="254" y1="250" x2="430" y2="250" stroke="#1f2933" stroke-width="2"/>
  <text x="300" y="242" fill="#52606d" font-family="Segoe UI, sans-serif" font-size="12">GND</text>
  <line x1="254" y1="290" x2="430" y2="290" stroke="#1f2933" stroke-width="2"/>
  <text x="300" y="282" fill="#52606d" font-family="Segoe UI, sans-serif" font-size="12">GPIO27</text>

  <rect x="760" y="168" width="310" height="160" rx="6" fill="#fff7ed" stroke="#9a3412" stroke-width="1.5"/>
  <text x="776" y="194" fill="#1f2933" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Opener wall button</text>
  <text x="776" y="222" fill="#1f2933" font-family="Segoe UI, sans-serif" font-size="14">Screw A</text>
  <text x="776" y="262" fill="#1f2933" font-family="Segoe UI, sans-serif" font-size="14">Screw B</text>
  <text x="776" y="296" fill="#52606d" font-family="Segoe UI, sans-serif" font-size="13">Photo eyes stay on their screws</text>
  <text x="776" y="314" fill="#52606d" font-family="Segoe UI, sans-serif" font-size="13">Motor wires are not used</text>
  <line x1="680" y1="218" x2="760" y2="218" stroke="#9a3412" stroke-width="2"/>
  <line x1="680" y1="258" x2="760" y2="258" stroke="#9a3412" stroke-width="2"/>
  <text x="692" y="210" fill="#9a3412" font-family="Segoe UI, sans-serif" font-size="12">COM</text>
  <text x="692" y="250" fill="#9a3412" font-family="Segoe UI, sans-serif" font-size="12">NO</text>

  <rect x="430" y="360" width="250" height="120" rx="6" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
  <text x="446" y="386" fill="#1f2933" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">VL53L1X</text>
  <text x="446" y="412" fill="#52606d" font-family="Segoe UI, sans-serif" font-size="14">VIN from 3V3</text>
  <text x="446" y="434" fill="#52606d" font-family="Segoe UI, sans-serif" font-size="14">GND to ESP32 GND</text>
  <text x="446" y="456" fill="#52606d" font-family="Segoe UI, sans-serif" font-size="14">SDA from GPIO21</text>
  <text x="446" y="478" fill="#52606d" font-family="Segoe UI, sans-serif" font-size="14">SCL from GPIO22</text>

  <line x1="254" y1="360" x2="430" y2="360" stroke="#1f2933" stroke-width="2"/>
  <text x="300" y="352" fill="#52606d" font-family="Segoe UI, sans-serif" font-size="12">3V3</text>
  <line x1="254" y1="400" x2="430" y2="400" stroke="#1f2933" stroke-width="2"/>
  <text x="300" y="392" fill="#52606d" font-family="Segoe UI, sans-serif" font-size="12">SDA</text>
  <line x1="254" y1="440" x2="430" y2="440" stroke="#1f2933" stroke-width="2"/>
  <text x="300" y="432" fill="#52606d" font-family="Segoe UI, sans-serif" font-size="12">SCL</text>

  <rect x="760" y="470" width="310" height="58" rx="6" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
  <text x="776" y="494" fill="#1f2933" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">S1 shut reed</text>
  <text x="776" y="514" fill="#52606d" font-family="Segoe UI, sans-serif" font-size="13">Other wire to GND. Closed = position 0</text>
  <line x1="254" y1="510" x2="760" y2="510" stroke="#1f2933" stroke-width="2"/>
  <text x="680" y="502" fill="#52606d" font-family="Segoe UI, sans-serif" font-size="12">GPIO25</text>

  <rect x="760" y="560" width="310" height="58" rx="6" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
  <text x="776" y="584" fill="#1f2933" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">S2 open reed</text>
  <text x="776" y="604" fill="#52606d" font-family="Segoe UI, sans-serif" font-size="13">Other wire to GND. Closed = position 1</text>
  <line x1="254" y1="560" x2="254" y2="589" stroke="#1f2933" stroke-width="2"/>
  <line x1="254" y1="589" x2="760" y2="589" stroke="#1f2933" stroke-width="2"/>
  <text x="470" y="581" fill="#52606d" font-family="Segoe UI, sans-serif" font-size="12">GPIO26</text>

  <text x="430" y="650" fill="#52606d" font-family="Segoe UI, sans-serif" font-size="13">Button screws are not connected to ESP32 ground.</text>
</svg>
